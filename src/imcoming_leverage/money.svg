<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- KRW banknote icon (light green). Solid fill so ManimGL renders it; ManimGL ignores linearGradient (url() -> black). -->

  <!-- bill body -->
  <rect x="20" y="50" width="360" height="100" rx="14" fill="#a7c992" stroke="#4f7a48" stroke-width="4"/>

  <!-- inner border -->
  <rect x="34" y="64" width="332" height="72" rx="8" fill="none" stroke="#4f7a48" stroke-width="2" opacity="0.5"/>

  <!-- center denomination symbol -->
  <g>
    <circle cx="200" cy="100" r="30" fill="#6e9a59" stroke="#3f6238" stroke-width="3"/>
    <!-- won mark W + two bars -->
    <g fill="none" stroke="#eef4e6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M188 88 L194 112 L200 94 L206 112 L212 88"/>
      <line x1="185" y1="100" x2="215" y2="100"/>
      <line x1="186" y1="106" x2="214" y2="106"/>
    </g>
  </g>

  <!-- four corner arcs -->
  <g fill="none" stroke="#4f7a48" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M52 74  a14 14 0 0 1 14 -14"/>
    <path d="M348 74 a14 14 0 0 0 -14 -14"/>
    <path d="M52 126 a14 14 0 0 0 14 14"/>
    <path d="M348 126 a14 14 0 0 1 -14 14"/>
  </g>
</svg>
